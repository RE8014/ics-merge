name: ICS Merge

on:
  push:
    paths:
      - 'calendar/*.ics'
  workflow_dispatch:

jobs:
  merge-to-gist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Merge ICS files and update Gist
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: |
          python3 -c "
          import glob, os, json, urllib.request

          # Step 1: Extract and merge events
          ics_files = glob.glob('calendar/*.ics')
          events = []

          for file_path in sorted(ics_files):
              with open(file_path, 'r', encoding='utf-8') as f:
                  content = f.read()
              
              in_event = False
              current_event = []
              for line in content.splitlines():
                  if line.startswith('BEGIN:VEVENT'):
                      in_event = True
                  if in_event:
                      current_event.append(line)
                  if line.startswith('END:VEVENT'):
                      in_event = False
                      events.append('\n'.join(current_event))
                      current_event = []

          header = 'BEGIN:VCALENDAR\nVERSION:2.0\nPRODID:-//Merged Calendar//EN\nCALSCALE:GREGORIAN'
          footer = 'END:VCALENDAR'
          merged_content = header + ('\n' + '\n'.join(events) if events else '') + '\n' + footer + '\n'

          # Step 2: Push to GitHub Gist API
          gist_id = os.environ['GIST_ID']
          gist_token = os.environ['GIST_TOKEN']

          url = f'https://api.github.com/gists/{gist_id}'
          payload = {
              'files': {
                  'calendar.ics': {
                      'content': merged_content
                  }
              }
          }

          req = urllib.request.Request(
              url,
              data=json.dumps(payload).encode('utf-8'),
              headers={
                  'Authorization': f'Bearer {gist_token}',
                  'Accept': 'application/vnd.github+json',
                  'Content-Type': 'application/json'
              },
              method='PATCH'
          )

          with urllib.request.urlopen(req) as response:
              print('Gist updated successfully. Status:', response.status)
          "
