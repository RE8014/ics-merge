name: Merge ICS Files

on:
  push:
    paths:
      - 'calendar/*.ics'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge-calendar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Merge ICS files
        run: |
          python3 -c "
          import glob, os

          ics_files = glob.glob('calendar/*.ics')
          events = []

          for file_path in sorted(ics_files):
              with open(file_path, 'r', encoding='utf-8') as f:
                  content = f.read()
              
              # Extract content between BEGIN:VEVENT and END:VEVENT
              in_event = False
              current_event = []
              for line in content.splitlines():
                  if line.startswith('BEGIN:VEVENT'):
                      in_event = True
                  if in_event:
                      current_event.append(line)
                  if line.startswith('END:VEVENT'):
                      in_event = False
                      events.append('\n'.join(current_event))
                      current_event = []

          header = 'BEGIN:VCALENDAR\nVERSION:2.0\nPRODID:-//Merged Calendar//EN\nCALSCALE:GREGORIAN'
          footer = 'END:VCALENDAR'
          
          merged_content = header + ('\n' + '\n'.join(events) if events else '') + '\n' + footer + '\n'

          with open('calendar.ics', 'w', encoding='utf-8') as f:
              f.write(merged_content)
          "

      - name: Commit and push updated calendar.ics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add calendar.ics
          
          # Only commit if calendar.ics actually changed
          if git diff --staged --quiet; then
            echo "No changes detected in calendar.ics."
          else
            git commit -m "chore: auto-merge ICS calendar files"
            git push
          fi
